# Publish the patched v3.8.53 runner-base image to this fork's GHCR namespace.
#
# GitHub only lists workflow_dispatch for files on the default branch. This
# fork's default branch stays release/v3.8.54, so the build is triggered by a
# push of this file on the patch branch instead of a dispatch or a merge.
# It does not run docker-publish.yml and does not push diegosouzapw/omniroute
# or ghcr.io/cheaper-inference/omniroute.

name: Publish patched runner-base image

on:
  push:
    branches:
      - cursor/fix-cli-profile-catalog-401-bbdd
    paths:
      - .github/workflows/publish-patched-runner-base.yml

permissions:
  contents: read

concurrency:
  group: publish-patched-runner-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner-base
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          no-cache: true
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          tags: |
            ghcr.io/tralalalalalawe/omniroute:3.8.53-profile-catalog-401
            ghcr.io/tralalalalalawe/omniroute:3.8.53-profile-catalog-401-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tralalalalalawe/OmniRoute
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=3.8.53-profile-catalog-401

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/tralalalalalawe/omniroute@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Allow unauthenticated pulls of this package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          code=$(curl -sS -o /tmp/pkg-vis.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/omniroute \
            -d '{"visibility":"public"}')
          echo "visibility_http=${code}"
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            python3 -c 'import json; d=json.load(open("/tmp/pkg-vis.json")); print(d.get("message","")); print(d.get("documentation_url",""))'
            exit 1
          fi
